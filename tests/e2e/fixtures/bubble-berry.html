<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plant render fixture</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: var(--sky); font: 15px sans-serif; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    #status, #stage-strip span { box-sizing: border-box; background: var(--paper); color: var(--ink); border: 3px solid var(--ink); border-radius: 14px; padding: 8px; box-shadow: 4px 4px var(--tomato); }
    #status { position: absolute; top: 8px; left: 8px; }
    #silhouette { position: absolute; inset: 64px auto auto 8px; width: 48px; height: 48px; }
    #stage-strip { position: absolute; inset: auto 0 0; height: 48px; color: var(--ink); }
    #stage-strip span { position: absolute; top: 0; transform: translateX(-50%); min-width: 48px; height: 48px; display: grid; place-items: center; white-space: nowrap; }
    #stage-strip span:nth-child(1) { left: 20%; }
    #stage-strip span:nth-child(2) { left: 35%; }
    #stage-strip span:nth-child(3) { left: 50%; }
    #stage-strip span:nth-child(4) { left: 65%; }
    #stage-strip span:nth-child(5) { left: 80%; }
    body[data-mode="six-ripe"] #stage-strip, body[data-mode="six-ripe"] #silhouette { display: none; }
    @media (max-aspect-ratio: 1/1) {
      #stage-strip { inset: 0 8px 0 auto; width: calc(100% - 16px); height: auto; display: block; }
      #stage-strip span { position: absolute; right: 0; transform: translateY(-50%); }
      #stage-strip span:nth-child(n) { left: auto; }
      #stage-strip span:nth-child(1) { top: 3.08%; }
      #stage-strip span:nth-child(2) { top: 23.82%; }
      #stage-strip span:nth-child(3) { top: 44.55%; }
      #stage-strip span:nth-child(4) { top: 65.28%; }
      #stage-strip span:nth-child(5) { top: 88.98%; }
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <canvas id="silhouette" aria-label="Bubble Berry silhouette"></canvas>
  <div id="status" data-render="pending">Loading</div>
  <div id="stage-strip"><span>Seed</span><span>Sprout</span><span>Growing</span><span>Mature</span><span>Harvestable</span></div>
  <script type="module" src="./bubble-berry.ts"></script>
</body>
</html>
