<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible&family=Fraunces:wght@650;700&display=swap"><title>Sunny Sprout stages</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--sky);font:15px 'Atkinson Hyperlegible','DejaVu Sans',sans-serif}canvas{position:absolute;inset:0;width:100%;height:100%}body[data-mode="reconcile"] #silhouette,body[data-mode="reconcile"] #stage-strip{display:none}#silhouette{inset:8px auto auto 120px;width:48px;height:48px}#stage-strip{position:absolute;inset:auto 0 18px;height:48px;color:var(--ink)}#stage-strip span,#status,label{box-sizing:border-box;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:8px;box-shadow:4px 4px var(--tomato)}#stage-strip span{position:absolute;top:0;transform:translateX(-50%);min-width:48px;height:48px;display:grid;place-items:center;white-space:nowrap;font:650 14px 'Fraunces','DejaVu Serif',serif}#stage-strip span:nth-child(1){left:28.9%}#stage-strip span:nth-child(2){left:39.45%}#stage-strip span:nth-child(3){left:50%}#stage-strip span:nth-child(4){left:60.55%}#stage-strip span:nth-child(5){left:71.1%}#status{position:absolute;top:8px;left:8px}label{position:absolute;right:8px;top:8px;min-height:48px;display:flex;align-items:center;gap:8px}#reduced-motion{width:24px;height:24px}@media(max-aspect-ratio:1/1){#stage-strip{inset:90px 8px;left:auto;right:8px;bottom:90px;height:auto;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end}#stage-strip span{position:static;transform:none}}
</style></head><body><canvas id="stage"></canvas><div id="status" data-render="pending">Loading</div><label><input id="reduced-motion" type="checkbox">Reduced motion</label><canvas id="silhouette" aria-label="Sunny Sprout silhouette"></canvas><div id="stage-strip"><span data-stage>Seed</span><span data-stage>Sprout</span><span data-stage>Growing</span><span data-stage>Mature</span><span data-stage>Harvestable</span></div><script type="module" src="./sunny-sprout.ts"></script></body></html>
