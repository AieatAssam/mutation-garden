<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mutation Garden: Seed Packet look prototype</title>
<!-- Art-direction prototype only. Not game code. Fonts and three are copied in by render.mjs. -->
<style>
  @font-face { font-family: "Fraunces"; src: url("./vendor/Fraunces.ttf"); font-weight: 100 900; }
  @font-face { font-family: "Atkinson Hyperlegible"; src: url("./vendor/Atkinson-Regular.ttf"); font-weight: 400; }
  @font-face { font-family: "Atkinson Hyperlegible"; src: url("./vendor/Atkinson-Bold.ttf"); font-weight: 700; }
  :root {
    --ink: #2B1E2E; --muted: #5E4A5C; --paper: #F7EEDB; --panel: #FFF9EC; --sunk: #EFE2C6;
    --accent: #C93A24; --misprint: #E5482F; --coin: #F2B632; --coin-text: #7A4B0C;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper); }
  #sky { position: fixed; inset: 0; background: linear-gradient(#7FBEDC 0%, #B9DCE3 38%, #F4E6C4 78%); }
  body.dusk #sky { background: linear-gradient(#3C4579 0%, #B8657F 45%, #F3A55C 85%); }
  canvas { position: fixed; inset: 0; }
  /* paper grain: printed on top of everything, multiply */
  #grain { position: fixed; inset: 0; pointer-events: none; mix-blend-mode: multiply; opacity: .22;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .45  0 0 0 0 .35  0 0 0 .9 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .ui { position: fixed; font-family: "Atkinson Hyperlegible", sans-serif; color: var(--ink); }
  .label { background: var(--panel); border: 3px solid var(--ink); border-radius: 18px;
    box-shadow: 4px 4px 0 var(--misprint); }
  #coins { top: 16px; left: 16px; display: flex; align-items: center; gap: 10px; padding: 6px 16px 6px 8px;
    font-weight: 700; font-size: 26px; font-variant-numeric: tabular-nums; }
  #journal { top: 16px; right: 16px; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; }
  #title { top: 84px; left: 50%; transform: translateX(-50%); white-space: nowrap; padding: 6px 18px 8px; text-align: center; font-family: "Fraunces", serif;
    font-variation-settings: "SOFT" 100, "WONK" 1, "opsz" 144; font-weight: 800; font-size: 34px; letter-spacing: -.01em; }
  #title small { display: block; font-family: "Atkinson Hyperlegible"; font-weight: 400; font-size: 15px; color: var(--muted); letter-spacing: .02em; }
  #tray { left: 12px; right: 12px; bottom: 96px; display: flex; gap: 10px; padding: 10px; }
  .card { flex: 1; background: var(--panel); border: 2.5px solid var(--ink); border-radius: 14px; padding: 8px 6px 6px;
    text-align: center; }
  .card.sel { background: #FFF1C9; box-shadow: inset 0 0 0 3px var(--coin); }
  .card .name { font-family: "Fraunces", serif; font-variation-settings: "SOFT" 100, "opsz" 24; font-weight: 700; font-size: 15px; }
  .card .cost { margin-top: 4px; display: inline-flex; align-items: center; gap: 4px; font-weight: 700; color: var(--coin-text); font-size: 15px; }
  .dot { width: 40px; height: 40px; margin: 2px auto 4px; border-radius: 50%; border: 2.5px solid var(--ink); }
  #harvest { left: 12px; right: 12px; bottom: 20px; height: 62px; border: 3px solid var(--ink); border-radius: 31px;
    background: var(--accent); color: var(--panel); font-family: "Fraunces", serif; font-variation-settings: "SOFT" 100, "WONK" 1, "opsz" 72;
    font-weight: 800; font-size: 26px; display: grid; place-items: center; box-shadow: 0 5px 0 var(--ink); }
  body.desktop #tray { left: auto; right: 24px; width: 420px; bottom: 110px; }
  body.desktop #harvest { left: auto; right: 24px; width: 446px; bottom: 28px; }
  body.desktop #title { top: 16px; }
  body.bare .ui { display: none; }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/examples/jsm/" } }</script>
</head>
<body>

<div id="grain"></div>
<svg width="0" height="0" style="position:absolute">
  <symbol id="coin" viewBox="0 0 40 40">
    <circle cx="20" cy="20" r="17.5" fill="#C9861C" stroke="#2B1E2E" stroke-width="2.5"/>
    <circle cx="20" cy="20" r="13" fill="#F2B632" stroke="#8C5A14" stroke-width="1.2" stroke-dasharray="1.6 1.6"/>
    <path d="M20 10c4.5 4 6 8 6 11.5a6 6 0 0 1-12 0C14 18 15.5 14 20 10z" fill="#FFE08A" stroke="#2B1E2E" stroke-width="1.8"/>
    <path d="M20 16v10" stroke="#C9861C" stroke-width="1.6" stroke-linecap="round"/>
  </symbol>
</svg>
<div class="ui label" id="coins"><svg width="40" height="40"><use href="#coin"/></svg>1,240</div>
<div class="ui label" id="journal"><svg width="28" height="28" viewBox="0 0 28 28"><path d="M14 25V9M14 15c-4 0-7-2-8-6 4 0 7 2 8 6zm0-3c3.5 0 6-2 7-5.5-3.5 0-6 2-7 5.5zm0 7c-3.5 0-6-2-7-5 3.5 0 6 2 7 5z" fill="#5FBF9F" stroke="#2B1E2E" stroke-width="2" stroke-linejoin="round"/></svg></div>
<div class="ui label" id="title">Mutation Garden<small>Tap a plot to plant</small></div>
<div class="ui label" id="tray">
  <div class="card sel"><div class="dot" style="background:#FFC93E"></div><div class="name">Sunny Sprout</div><div class="cost"><svg width="18" height="18"><use href="#coin"/></svg>10</div></div>
  <div class="card"><div class="dot" style="background:#FF7FAC"></div><div class="name">Bubble Berry</div><div class="cost"><svg width="18" height="18"><use href="#coin"/></svg>25</div></div>
  <div class="card"><div class="dot" style="background:#9472F2"></div><div class="name">Twistroot</div><div class="cost"><svg width="18" height="18"><use href="#coin"/></svg>60</div></div>
</div>
<div class="ui" id="harvest">Harvest all</div>
<script type="module" src="./scene.js"></script>
</body>
</html>
